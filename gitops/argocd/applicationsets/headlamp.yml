apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: headlamp
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  goTemplate: true
  goTemplateOptions:
    - missingkey=error
  syncPolicy:
    applicationsSync: create-update
    preserveResourcesOnDeletion: true

  generators:
    - matrix:
        generators:
          - git:
              repoURL: https://github.com/lhtran-homelab/infrastructures.git
              revision: master
              files:
                - path: gitops/clusters/*/headlamp/release.yml
          - git:
              repoURL: https://github.com/lhtran-homelab/infrastructures.git
              revision: master
              files:
                - path: "gitops/clusters/{{index .path.segments 2}}/config.yml"

  template:
    metadata:
      name: "{{.cluster.name}}-headlamp"
      labels:
        cluster: "{{.cluster.name}}"
        component: headlamp
    spec:
      project: platform-apps

      sources:
        - repoURL: https://github.com/lhtran-homelab/infrastructures.git
          targetRevision: master
          ref: values

        - repoURL: https://kubernetes-sigs.github.io/headlamp
          chart: headlamp
          targetRevision: "{{.release.version}}"
          helm:
            valueFiles:
              - $values/gitops/defaults/headlamp/values.yml
              - $values/gitops/clusters/{{.cluster.name}}/headlamp/values.yml

        - repoURL: https://github.com/lhtran-homelab/infrastructures.git
          targetRevision: master
          path: "gitops/clusters/{{.cluster.name}}/headlamp/manifests"

      destination:
        name: "{{.destination.name}}"
        namespace: kube-system

      syncPolicy:
        managedNamespaceMetadata:
          labels:
            shared-traefik-gateway-access: "true"      
        automated:
          enabled: true
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - PruneLast=true
          - ServerSideApply=true
          - FailOnSharedResource=true
        retry:
          limit: 10
          backoff:
            duration: 5s
            factor: 2
            maxDuration: 3m
