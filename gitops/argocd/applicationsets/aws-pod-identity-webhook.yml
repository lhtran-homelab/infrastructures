apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: aws-pod-identity-webhook
  namespace: argocd
  annotations:
    # Create the webhook application before workloads that rely on IRSA.
    argocd.argoproj.io/sync-wave: "0"
spec:
  goTemplate: true
  goTemplateOptions:
    - missingkey=error
  syncPolicy:
    applicationsSync: create-update
    preserveResourcesOnDeletion: true

  generators:
    - matrix:
        generators:
          - git:
              repoURL: https://github.com/lhtran-homelab/infrastructures.git
              revision: master
              files:
                - path: gitops/clusters/*/aws-pod-identity-webhook/release.yml
          - git:
              repoURL: https://github.com/lhtran-homelab/infrastructures.git
              revision: master
              files:
                - path: "gitops/clusters/{{index .path.segments 2}}/config.yml"

  template:
    metadata:
      name: "{{.cluster.name}}-aws-pod-identity-webhook"
      labels:
        cluster: "{{.cluster.name}}"
        component: aws-pod-identity-webhook
    spec:
      project: platform-apps
      source:
        repoURL: https://github.com/lhtran-homelab/infrastructures.git
        targetRevision: master
        path: "gitops/clusters/{{.cluster.name}}/aws-pod-identity-webhook/manifests"
        kustomize:
          images:
            - "public.ecr.aws/eks/amazon-eks-pod-identity-webhook:v{{.release.version}}"
      destination:
        name: "{{.destination.name}}"
        namespace: aws-pod-identity-webhook
      syncPolicy:
        automated:
          enabled: true
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - PruneLast=true
          - ServerSideApply=true
          - FailOnSharedResource=true
        retry:
          limit: 10
          backoff:
            duration: 5s
            factor: 2
            maxDuration: 3m
