apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: csi-secrets-store
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  goTemplate: true
  goTemplateOptions:
    - missingkey=error
  syncPolicy:
    applicationsSync: create-update
    preserveResourcesOnDeletion: true

  generators:
    - matrix:
        generators:
          - git:
              repoURL: https://github.com/lhtran-homelab/infrastructures.git
              revision: master
              files:
                - path: gitops/clusters/*/csi-secrets-store/release.yml
          - git:
              repoURL: https://github.com/lhtran-homelab/infrastructures.git
              revision: master
              files:
                - path: "gitops/clusters/{{index .path.segments 2}}/config.yml"

  template:
    metadata:
      name: "{{.cluster.name}}-csi-secrets-store"
      labels:
        cluster: "{{.cluster.name}}"
        component: csi-secrets-store
    spec:
      project: platform-apps

      sources:
        - repoURL: https://github.com/lhtran-homelab/infrastructures.git
          targetRevision: master
          ref: values

        - repoURL: https://kubernetes-sigs.github.io/secrets-store-csi-driver/charts
          chart: secrets-store-csi-driver
          targetRevision: "{{.release.version}}"
          helm:
            valueFiles:
              - $values/gitops/defaults/csi-secrets-store/values.yml
              - $values/gitops/clusters/{{.cluster.name}}/csi-secrets-store/values.yml

        - repoURL: https://github.com/lhtran-homelab/infrastructures.git
          targetRevision: master
          path: "gitops/clusters/{{.cluster.name}}/csi-secrets-store/manifests"

      destination:
        name: "{{.destination.name}}"
        namespace: kube-system

      syncPolicy:
        automated:
          enabled: true
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - PruneLast=true
          - ServerSideApply=true
          - FailOnSharedResource=true
        retry:
          limit: 10
          backoff:
            duration: 5s
            factor: 2
            maxDuration: 3m
