apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: external-secrets
  namespace: argocd
  annotations:
    # Ahead of cert-manager: its issuers consume Secrets materialised here.
    argocd.argoproj.io/sync-wave: "-2"
spec:
  goTemplate: true
  goTemplateOptions:
    - missingkey=error

  syncPolicy:
    applicationsSync: create-update
    preserveResourcesOnDeletion: true

  # An Application is produced only for clusters that opt in by committing
  # gitops/clusters/<cluster>/external-secrets/release.yml. The second generator
  # pulls the shared cluster identity from that cluster's config.yml.
  generators:
    - matrix:
        generators:
          - git:
              repoURL: https://github.com/lhtran-homelab/infrastructures.git
              revision: master
              files:
                - path: gitops/clusters/*/external-secrets/release.yml
          - git:
              repoURL: https://github.com/lhtran-homelab/infrastructures.git
              revision: master
              files:
                - path: "gitops/clusters/{{index .path.segments 2}}/config.yml"

  template:
    metadata:
      name: "{{.cluster.name}}-external-secrets"
      labels:
        cluster: "{{.cluster.name}}"
        component: external-secrets
    spec:
      project: platform-apps

      sources:
        - repoURL: https://github.com/lhtran-homelab/infrastructures.git
          targetRevision: master
          ref: values

        - repoURL: https://charts.external-secrets.io
          chart: external-secrets
          targetRevision: "{{.release.version}}"
          helm:
            valueFiles:
              - $values/gitops/defaults/external-secrets/values.yml
              - $values/gitops/clusters/{{.cluster.name}}/external-secrets/values.yml

        # Cluster-specific ClusterSecretStore and provider wiring.
        - repoURL: https://github.com/lhtran-homelab/infrastructures.git
          targetRevision: master
          path: "gitops/clusters/{{.cluster.name}}/external-secrets/manifests"

      destination:
        name: "{{.destination.name}}"
        namespace: external-secrets

      syncPolicy:
        automated:
          enabled: true
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - PruneLast=true
          - ServerSideApply=true
          - FailOnSharedResource=true
        retry:
          limit: 10
          backoff:
            duration: 5s
            factor: 2
            maxDuration: 3m
