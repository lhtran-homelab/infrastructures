apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: argocd-pocketid-oidc
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-ssm
    kind: ClusterSecretStore
  target:
    name: argocd-pocketid-oidc
    creationPolicy: Owner
    template:
      metadata:
        labels:
          app.kubernetes.io/part-of: argocd
  data:
    - secretKey: issuer
      remoteRef:
        key: /infrastructures/pve-talos-clusters/platform-cluster-01/argocd/pocketid/issuer
    - secretKey: clientID
      remoteRef:
        key: /infrastructures/pve-talos-clusters/platform-cluster-01/argocd/pocketid/client-id
    - secretKey: clientSecret
      remoteRef:
        key: /infrastructures/pve-talos-clusters/platform-cluster-01/argocd/pocketid/client-secret
