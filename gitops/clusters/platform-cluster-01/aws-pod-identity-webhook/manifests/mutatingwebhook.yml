apiVersion: admissionregistration.k8s.io/v1
kind: MutatingWebhookConfiguration
metadata:
  name: pod-identity-webhook
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    cert-manager.io/inject-ca-from: aws-pod-identity-webhook/pod-identity-webhook
webhooks:
  - name: pod-identity-webhook.amazonaws.com
    admissionReviewVersions:
      - v1beta1
    sideEffects: None
    failurePolicy: Ignore
    clientConfig:
      service:
        name: pod-identity-webhook
        namespace: aws-pod-identity-webhook
        path: /mutate
        port: 443
    namespaceSelector:
      matchLabels:
        aws-irsa-webhook: enabled
    objectSelector:
      matchExpressions:
        - key: eks.amazonaws.com/skip-pod-identity-webhook
          operator: DoesNotExist
    rules:
      - operations:
          - CREATE
        apiGroups:
          - ""
        apiVersions:
          - v1
        resources:
          - pods
